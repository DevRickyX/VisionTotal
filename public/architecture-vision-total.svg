<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura propuesta para la nueva web de Visión Total</title>
  <desc id="desc">Diagrama de pacientes y editores conectados a una aplicación Next.js desplegada en Vercel, con Sanity como CMS y Supabase para datos mínimos de formularios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fbfc"/>
      <stop offset="1" stop-color="#e8f2f8"/>
    </linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063b5c"/>
      <stop offset="1" stop-color="#052d4c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#052d4c" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#0b638f"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#6d8fa2"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="1460" cy="115" r="190" fill="#d6f0f2" opacity=".65"/>
  <circle cx="115" cy="930" r="230" fill="#f9e8b5" opacity=".45"/>

  <text x="90" y="86" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">Arquitectura propuesta · Visión Total</text>
  <text x="90" y="128" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Contenido público centralizado, formularios separados y una interfaz accesible</text>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="300" height="136" rx="24" fill="#ffffff" stroke="#a9ccd7" stroke-width="2"/>
    <circle cx="150" cy="248" r="30" fill="#dff3f5"/>
    <path d="M135 249h30M150 234v30" stroke="#087f9b" stroke-width="5" stroke-linecap="round"/>
    <text x="198" y="237" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Pacientes</text>
    <text x="198" y="270" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Móvil · escritorio</text>
    <text x="120" y="304" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Teclado · lector de pantalla</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1210" y="190" width="300" height="136" rx="24" fill="#ffffff" stroke="#a9ccd7" stroke-width="2"/>
    <circle cx="1270" cy="248" r="30" fill="#fff0c9"/>
    <path d="M1254 259l29-29m-24 0h24v24" fill="none" stroke="#8a5f00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1318" y="237" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Editores</text>
    <text x="1318" y="270" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Equipo Visión Total</text>
    <text x="1240" y="304" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Actualizan una sola fuente</text>
  </g>

  <path d="M390 258H585" stroke="#0b638f" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="438" y="238" fill="#426d82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">HTTPS</text>

  <g filter="url(#shadow)">
    <rect x="585" y="180" width="430" height="156" rx="28" fill="#ffffff" stroke="#82b9c7" stroke-width="3"/>
    <rect x="615" y="210" width="94" height="94" rx="20" fill="#dff3f5"/>
    <path d="M635 270l25-36 29 36-27-15z" fill="#087f9b"/>
    <text x="745" y="228" fill="#075d79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2">ENTREGA</text>
    <text x="745" y="263" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Vercel CDN / Edge</text>
    <text x="745" y="295" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">SSL · caché · despliegue continuo</text>
  </g>

  <path d="M1210 258H1062" stroke="#0b638f" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1085" y="238" fill="#426d82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Vista previa</text>

  <path d="M800 336v86" stroke="#0b638f" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="405" y="420" width="790" height="270" rx="32" fill="url(#next)"/>
    <text x="455" y="472" fill="#8ee2e5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="2">APLICACIÓN WEB</text>
    <text x="455" y="515" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Next.js 16 · App Router · React 19</text>
    <text x="455" y="550" fill="#cbe2ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">TypeScript · Tailwind CSS 4 · Server Components</text>

    <rect x="455" y="582" width="210" height="66" rx="16" fill="#ffffff" opacity=".1" stroke="#8ee2e5"/>
    <text x="480" y="610" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">UI accesible</text>
    <text x="480" y="634" fill="#cbe2ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">WCAG · responsive</text>

    <rect x="695" y="582" width="210" height="66" rx="16" fill="#ffffff" opacity=".1" stroke="#8ee2e5"/>
    <text x="720" y="610" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Capa content</text>
    <text x="720" y="634" fill="#cbe2ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Sin acoplar el CMS</text>

    <rect x="935" y="582" width="210" height="66" rx="16" fill="#ffffff" opacity=".1" stroke="#8ee2e5"/>
    <text x="960" y="610" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Server Actions</text>
    <text x="960" y="634" fill="#cbe2ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Validación con Zod</text>
  </g>

  <path d="M690 690v90" stroke="#0b638f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1040 690v90" stroke="#0b638f" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="405" y="780" width="570" height="180" rx="28" fill="#ffffff" stroke="#82b9c7" stroke-width="3"/>
    <rect x="435" y="810" width="112" height="112" rx="22" fill="#f6e9ff"/>
    <circle cx="491" cy="866" r="29" fill="none" stroke="#7c3ea1" stroke-width="7"/>
    <path d="M491 834v64M459 866h64" stroke="#7c3ea1" stroke-width="6" stroke-linecap="round"/>
    <text x="580" y="826" fill="#7c3ea1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2">CMS RECOMENDADO</text>
    <text x="580" y="866" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Sanity</text>
    <text x="580" y="900" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Sedes · servicios · artículos · navegación</text>
    <text x="580" y="929" fill="#075d79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Webhook → revalidación de Next.js</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="780" width="500" height="180" rx="28" fill="#ffffff" stroke="#82b9c7" stroke-width="3"/>
    <rect x="1040" y="810" width="112" height="112" rx="22" fill="#dff3f5"/>
    <path d="M1068 889l56-58-24 45h25z" fill="#087f9b"/>
    <text x="1185" y="826" fill="#087f9b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2">DATOS DE FORMULARIOS</text>
    <text x="1185" y="866" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Supabase</text>
    <text x="1185" y="900" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">PostgreSQL · RLS · auditoría</text>
    <text x="1185" y="929" fill="#8a4200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Solo datos mínimos · no historia clínica</text>
  </g>

  <path d="M1335 326v390c0 35-27 64-62 64H865" fill="none" stroke="#6d8fa2" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-soft)"/>
  <text x="1354" y="525" fill="#5d7d8e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" transform="rotate(90 1354 525)">Edita y publica contenido</text>

  <g>
    <rect x="90" y="760" width="270" height="190" rx="24" fill="#fffaf0" stroke="#e2bd63" stroke-width="2" stroke-dasharray="9 8"/>
    <text x="120" y="803" fill="#7d5400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1">ALTERNATIVA</text>
    <text x="120" y="840" fill="#052d4c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800">Payload CMS</text>
    <text x="120" y="875" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Reemplaza Sanity, pero</text>
    <text x="120" y="902" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">requiere operar hosting,</text>
    <text x="120" y="929" fill="#45677c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">base de datos y archivos.</text>
  </g>
</svg>
